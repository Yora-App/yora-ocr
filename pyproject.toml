[project]
name = "yora_ocr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python>=5.0.0.93",
    "paddleocr[all]>=3.5.0",
    "paddlepaddle==3.2.0",
    "pre-commit>=4.6.0",
    "pydantic>=2.13.3",
    "shapely>=2.1.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
paddlepaddle = { index = "paddlepaddle" }

[[tool.uv.index]]
name = "paddlepaddle"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
